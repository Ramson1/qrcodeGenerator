<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner & Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-qrcode"></i>
                <h1>QR Code Studio</h1>
            </div>
            <p class="subtitle">Generate & Scan QR Codes Instantly</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="generator">
                <i class="fas fa-magic"></i>
                <span>Generate</span>
            </button>
            <button class="tab-btn" data-tab="scanner">
                <i class="fas fa-camera"></i>
                <span>Scan</span>
            </button>
        </div>

        <main class="card">
            <!-- Generator Section -->
            <section id="generator" class="tab-content active">
                <div class="input-group">
                    <label for="qr-input">
                        <i class="fas fa-edit"></i>
                        Enter Text or URL
                    </label>
                    <textarea 
                        id="qr-input" 
                        placeholder="Enter your text, URL, or any data here..."
                        rows="4"
                    ></textarea>
                </div>

                <div class="color-options">
                    <div class="color-picker">
                        <label for="qr-color">
                            <i class="fas fa-palette"></i>
                            QR Color
                        </label>
                        <input type="color" id="qr-color" value="#000000">
                    </div>
                    <div class="color-picker">
                        <label for="bg-color">
                            <i class="fas fa-fill-drip"></i>
                            Background
                        </label>
                        <input type="color" id="bg-color" value="#ffffff">
                    </div>
                </div>

                <button id="generate-btn" class="btn-primary">
                    <i class="fas fa-bolt"></i>
                    Generate QR Code
                </button>

                <div id="qr-output" class="qr-output hidden">
                    <div id="qr-code"></div>
                    <div class="qr-actions">
                        <button id="download-btn" class="btn-secondary">
                            <i class="fas fa-download"></i>
                            Download PNG
                        </button>
                        <button id="clear-btn" class="btn-secondary">
                            <i class="fas fa-redo"></i>
                            Clear
                        </button>
                    </div>
                </div>
            </section>

            <!-- Scanner Section -->
            <section id="scanner" class="tab-content">
                <div class="scanner-controls">
                    <button id="start-camera-btn" class="btn-primary">
                        <i class="fas fa-video"></i>
                        Start Camera
                    </button>
                    <button id="stop-camera-btn" class="btn-secondary hidden">
                        <i class="fas fa-stop"></i>
                        Stop Camera
                    </button>
                </div>

                <div id="reader" class="scanner-viewfinder hidden"></div>

                <div class="upload-section">
                    <p class="divider">Or upload an image</p>
                    <label for="file-upload" class="btn-secondary upload-btn">
                        <i class="fas fa-upload"></i>
                        Choose Image
                    </label>
                    <input type="file" id="file-upload" accept="image/*" class="hidden">
                </div>

                <div id="scan-result" class="scan-result hidden">
                    <div class="result-header">
                        <i class="fas fa-check-circle"></i>
                        <h3>Scan Result</h3>
                    </div>
                    <div id="result-content" class="result-content"></div>
                    <div class="result-actions">
                        <button id="copy-btn" class="btn-secondary">
                            <i class="fas fa-copy"></i>
                            Copy
                        </button>
                        <button id="clear-scan-btn" class="btn-secondary">
                            <i class="fas fa-redo"></i>
                            Clear
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Made with <i class="fas fa-heart"></i> using HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
